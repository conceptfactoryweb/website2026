<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Actuals · Concept Factory</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0d0e12" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0d0e12; --panel:#15171d; --panel2:#1c1f27; --line:#282c36;
  --text:#eceef1; --muted:#8b90a0; --magenta:#E6007E; --grey:#706F6F;
  --green:#22c55e; --amber:#f2a900; --blue:#3b82f6; --red:#ff5470; --radius:8px;
  --shadow:0 6px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(1100px 520px at 82% -12%,#3a0f4922,transparent),var(--bg);
  color:var(--text);font-family:'Inter',system-ui,-apple-system,Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
.hidden{display:none!important}
h1,h2,h3,.disp{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px}
header{display:flex;align-items:center;gap:20px;padding:20px 26px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(13,14,18,.88);backdrop-filter:blur(8px);z-index:20;flex-wrap:wrap}
.wm{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:.9;user-select:none}
.wm .l1{font-family:'Oswald';font-weight:700;letter-spacing:1px;font-size:20px}
.wm .l2{font-family:'Oswald';font-weight:700;letter-spacing:1px;font-size:20px;border-bottom:3px solid var(--magenta);padding-bottom:2px}
.wm .tag{font-size:9px;letter-spacing:2.5px;color:var(--muted);margin-top:5px;font-weight:600;font-family:'Inter'}
.spacer{flex:1}
.tabs{display:flex;gap:6px;background:var(--panel);padding:5px;border-radius:8px;border:1px solid var(--line)}
.tab{padding:8px 15px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted);font-size:13px;font-family:'Oswald';text-transform:uppercase;letter-spacing:.6px;transition:.15s}
.tab.active{background:var(--magenta);color:#fff}
.tab:hover:not(.active){color:var(--text)}
.controls{display:flex;align-items:center;gap:10px}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 14px;border-radius:6px;cursor:pointer;font-size:13px;display:inline-flex;gap:7px;align-items:center;font-family:'Inter'}
.btn:hover{border-color:var(--magenta)}
.upd{color:var(--muted);font-size:12px}
main{padding:26px;max-width:1280px;margin:0 auto}
h2.section{font-size:13px;letter-spacing:2px;color:var(--muted);margin:8px 0 14px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:26px}
.kpi{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--accent,var(--magenta));opacity:.12}
.kpi .lab{font-size:12px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;font-weight:600;font-family:'Oswald'}
.kpi .val{font-family:'Oswald';font-size:26px;font-weight:700;margin-top:8px}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:26px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.card h3{margin:0 0 14px;font-size:15px}
.chartwrap{position:relative;height:300px}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.5px;text-transform:uppercase;position:sticky;top:0;background:var(--panel2);font-family:'Oswald'}
tbody tr:hover{background:var(--panel2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.total td{font-weight:700;border-top:2px solid var(--line);background:#191c24}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.neg{color:var(--red);font-weight:700}
.pos{color:var(--green);font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;font-size:12.5px;font-weight:600}
.chip.on{background:var(--magenta);color:#fff;border-color:var(--magenta)}
.note{color:var(--muted);font-size:12.5px;margin:-6px 0 16px}
.goalhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:10px}
.goaltitle{font-family:'Oswald';text-transform:uppercase;letter-spacing:.5px;font-size:14px}
.goalpct{font-family:'Oswald';font-weight:700;font-size:22px}
.goalbar{height:12px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.goalfill{height:100%;border-radius:999px;transition:width .8s ease}
.goalvals{margin-top:11px;font-size:13.5px}
.goalnote{margin-top:4px;font-size:12.5px;color:var(--muted)}
.err-banner{background:#3a1520;border:1px solid #5c2030;color:#ffb3c1;padding:12px 16px;border-radius:8px;margin-bottom:18px;font-size:13.5px}
.demo-banner{background:#2a2413;border:1px solid #4d4320;color:#f2d98a;padding:10px 16px;border-radius:8px;margin-bottom:18px;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="wm"><div class="l1">CONCEPT</div><div class="l2">FACTORY</div><div class="tag">ACTUALS</div></div>
  <div class="spacer"></div>
  <div class="tabs">
    <div class="tab active" data-view="pipeline" onclick="switchView('pipeline')">Pipeline</div>
    <div class="tab" data-view="nacalc" onclick="switchView('nacalc')">Nacalculatie</div>
    <div class="tab" data-view="financieel" onclick="switchView('financieel')">Financieel</div>
    <div class="tab" data-view="doelen" onclick="switchView('doelen')">Doelen</div>
  </div>
  <div class="controls">
    <button class="btn" onclick="loadAll()"><span id="spin">⟳</span> Vernieuw</button>
    <span class="upd" id="lastupd"></span>
  </div>
</header>
<main>
  <div id="msg"></div>
  <div id="view-pipeline"></div>
  <div id="view-nacalc" class="hidden"></div>
  <div id="view-financieel" class="hidden"></div>
  <div id="view-doelen" class="hidden"></div>
</main>

<script>
/* ====== CONFIG — Google Sheets (Rob's Drive) ====== */
const SHEET_PIPELINE = "1MbTRTnWCx95SnNZ2SGg8uhRZXo26q1m2SWzcccQbvhw";
const SHEET_NACALC   = "1UU3HPbi0yi-8iHENd9KRwuhLk0FXx3ZUGANs33AT9qQ";
const SHEET_FIN      = "1qfHeqx4cklvsMJ2Is3LKkOsncVU3Gf6ort_l-Yu8kpk";
const SHEET_DOELEN   = "1R_SoGClCPUBLGccmAWO7Uvtk-QqXRl0Xc8nNxWjkeH0";

const DEMO_PIPELINE = [
 ["Voorbeeldproject A","Klant A","Decor","O26XXXX","Bevestigd","25000","0.3","","","—","Demo"],
 ["Voorbeeldproject B","Klant B","EPS sculptuur","O26XXXX","Offerte uit","12000","0.3","","","—","Demo"],
];
const DEMO_NACALC = [
 ["Voorbeeldproject A","afgewerkt","25000","4000","6000","5000","1500",""],
 ["Voorbeeldproject B","actief","12000","5000","2000","2500","500",""],
];
const DEMO_FIN = [
 ["KPI","Voorbeeld-KPI","0","0","Demo"],
];
const DEMO_DOELEN = [
 ["Voorbeelddoel","0","5","10","EUR","Demo"],
];

/* en-US numeriek (gviz geeft punt-decimaal, geen duizendtal) */
const num=s=>{ if(s===''||s==null) return NaN; const v=parseFloat(String(s).replace(/[^0-9.\-]/g,'')); return v; };
const marge=s=>{ if(s==null||s==='') return 0.30; let v=parseFloat(String(s).replace('%','').replace(',','.').replace(/[^0-9.\-]/g,'')); if(isNaN(v)) return 0.30; if(v>1) v=v/100; return v; };
const euro=n=>isNaN(n)||n===null?'—':new Intl.NumberFormat('nl-BE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
const pct=n=>isNaN(n)?'—':(n*100).toFixed(1).replace('.',',')+'%';
function parseCSV(t){const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else{if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c=='\r'){}else f+=c}}
  if(f!==''||row.length){row.push(f);rows.push(row)}return rows;}
async function fetchSheet(id){
  const url='https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?tqx=out:csv&_cb='+Date.now();
  const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
  const rows=parseCSV(await r.text());return rows.slice(1).filter(r=>r.some(c=>String(c).trim()!==''));}

let PIPE=[],NAC=[],FIN=[],DOEL=[],charts={},statusFilter=null,nacFilter=null,live=false;
const SC={'offerte':'var(--amber)','bevestigd':'var(--magenta)','productie':'var(--blue)','geleverd':'var(--green)','innen':'var(--green)','geind':'var(--green)','verloren':'#6b7280','afgewerkt':'var(--green)','actief':'var(--amber)'};
function statusColor(s){s=(s||'').toLowerCase();for(const k in SC)if(s.includes(k))return SC[k];return 'var(--muted)';}

async function loadAll(){
  document.getElementById('spin').textContent='…';document.getElementById('msg').innerHTML='';
  const res=await Promise.allSettled([fetchSheet(SHEET_PIPELINE),fetchSheet(SHEET_NACALC),fetchSheet(SHEET_FIN),fetchSheet(SHEET_DOELEN)]);
  PIPE=res[0].status==='fulfilled'?res[0].value:DEMO_PIPELINE;
  NAC =res[1].status==='fulfilled'?res[1].value:DEMO_NACALC;
  FIN =res[2].status==='fulfilled'?res[2].value:DEMO_FIN;
  DOEL=res[3].status==='fulfilled'?res[3].value:DEMO_DOELEN;
  const fails=res.filter(r=>r.status==='rejected').length;live=fails===0;
  if(fails)document.getElementById('msg').innerHTML='<div class="err-banner">'+fails+' Sheet(s) niet leesbaar — zet elke Sheet op “iedereen met de link – lezer”. De overige tabs tonen wel live data.</div>';
  document.getElementById('lastupd').textContent='Bijgewerkt '+new Date().toLocaleString('nl-BE',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});
  document.getElementById('spin').textContent='⟳';renderPipeline();renderNacalc();renderFinancieel();renderDoelen();
}

/* ========== PIPELINE ========== */
function renderPipeline(){
  const rows=PIPE.map(r=>({proj:r[0],klant:r[1],type:r[2],onr:r[3],status:r[4],verkoop:num(r[5]),marge:marge(r[6]),inn:r[8],opm:r[10]}));
  const has=s=>rows.filter(r=>(r.status||'').toLowerCase().includes(s));
  const sum=a=>a.reduce((t,r)=>t+(isNaN(r.verkoop)?0:r.verkoop),0);
  const sumM=a=>a.reduce((t,r)=>t+(isNaN(r.verkoop)?0:r.verkoop*r.marge),0);
  const bev=has('bevestigd').concat(has('productie')),off=has('offerte'),inn=has('geleverd');
  const kpis=[
    {lab:'Bevestigd + productie',val:euro(sum(bev)),sub:'≈ '+euro(sumM(bev))+' marge',acc:'var(--magenta)'},
    {lab:'Offerte uit',val:euro(sum(off)),sub:off.length+' offertes · niet in prognose',acc:'var(--amber)'},
    {lab:'Geleverd — te innen',val:euro(sum(inn)),sub:'openstaande vordering',acc:'var(--green)'},
    {lab:'Vastgelegd totaal',val:euro(sum(bev)+sum(inn)),sub:'bevestigd + geleverd · excl. offertes',acc:'var(--blue)'},
  ];
  const statuses=[...new Set(rows.map(r=>r.status))];
  let h='<h2 class="section">Pipeline</h2><div class="kpis">'+kpis.map(k=>`<div class="kpi" style="--accent:${k.acc}"><div class="lab">${k.lab}</div><div class="val">${k.val}</div><div class="sub">${k.sub}</div></div>`).join('')+'</div>';
  h+='<div class="grid2"><div class="card"><h3>Verkoop per project</h3><div class="chartwrap"><canvas id="cPipe"></canvas></div></div><div class="card"><h3>Verdeling per status</h3><div class="chartwrap"><canvas id="cStatus"></canvas></div></div></div>';
  h+='<div class="filters">'+['Alle',...statuses].map(s=>`<span class="chip${(statusFilter===s||(!statusFilter&&s==='Alle'))?' on':''}" onclick="setFilter('${(s||'').replace(/'/g,'')}')">${s||'—'}</span>`).join('')+'</div>';
  h+='<div class="tablewrap"><table><thead><tr><th>Project</th><th>Klant</th><th>Offerte</th><th>Status</th><th class="num">Verkoop</th><th class="num">Marge</th><th>Inning</th><th>Opmerking</th></tr></thead><tbody>';
  rows.filter(r=>!statusFilter||statusFilter==='Alle'||r.status===statusFilter).forEach(r=>{h+=`<tr><td>${r.proj}</td><td>${r.klant||''}</td><td>${r.onr||''}</td><td><span class="pill" style="background:${statusColor(r.status)}22;color:${statusColor(r.status)}">${r.status||'—'}</span></td><td class="num">${euro(r.verkoop)}</td><td class="num">${euro(isNaN(r.verkoop)?NaN:r.verkoop*r.marge)}</td><td>${r.inn||''}</td><td style="white-space:normal;color:var(--muted)">${r.opm||''}</td></tr>`;});
  h+='</tbody></table></div>';document.getElementById('view-pipeline').innerHTML=h;
  const named=rows.filter(r=>!isNaN(r.verkoop)).sort((a,b)=>b.verkoop-a.verkoop);
  drawBar('cPipe',named.map(r=>r.proj),named.map(r=>r.verkoop),named.map(r=>statusColor(r.status)));
  const byS={};rows.forEach(r=>{if(!isNaN(r.verkoop))byS[r.status]=(byS[r.status]||0)+r.verkoop});
  drawDoughnut('cStatus',Object.keys(byS),Object.values(byS),Object.keys(byS).map(statusColor));
}
function setFilter(s){statusFilter=s;renderPipeline();}

/* ========== NACALCULATIE ========== */
function renderNacalc(){
  const all=NAC.map(r=>{const v=num(r[2]),mat=num(r[3])||0,fr=num(r[4])||0,lo=num(r[5])||0,ov=num(r[6])||0;
    const k=mat+fr+lo+ov,m=v-k,p=v?m/v:0,j=k/0.7,d=v-j;return{proj:r[0],status:r[1]||'',v,k,m,p,j,d,les:r[7]};});
  const done=all.filter(r=>(r.status||'').toLowerCase().includes('afgewerkt'));
  const base=done.length?done:all;
  const tl=base.filter(r=>r.d<0),tot=tl.reduce((t,r)=>t+r.d,0),gem=base.length?base.reduce((t,r)=>t+r.p,0)/base.length:0;
  const kpis=[
    {lab:'Projecten (afgewerkt)',val:done.length+' / '+all.length,sub:'totaal in nacalc',acc:'var(--blue)'},
    {lab:'Gem. netto marge',val:pct(gem),sub:'afgewerkte projecten · streef ≥30%',acc:gem<0.3?'var(--red)':'var(--green)'},
    {lab:'Te laag geprijsd',val:tl.length+'/'+base.length,sub:'onder juiste prijs',acc:'var(--amber)'},
    {lab:'Totale onderprijzing',val:euro(tot),sub:'gemiste marge (afgewerkt)',acc:'var(--red)'},
  ];
  const statuses=[...new Set(all.map(r=>r.status))];
  let h='<h2 class="section">Nacalculatie — geoffreerd vs. juiste prijs (@30% na álle loon)</h2><div class="kpis">'+kpis.map(k=>`<div class="kpi" style="--accent:${k.acc}"><div class="lab">${k.lab}</div><div class="val">${k.val}</div><div class="sub">${k.sub}</div></div>`).join('')+'</div>';
  h+='<div class="card" style="margin-bottom:26px"><h3>Werkelijke verkoop vs. juiste prijs</h3><div class="chartwrap"><canvas id="cNac"></canvas></div></div>';
  h+='<div class="note">Kengetallen o.b.v. <b>afgewerkte</b> projecten. “Actief” = lopend: kosten/omzet nog niet volledig geboekt, dus de marge kan vertekend zijn.</div>';
  h+='<div class="filters">'+['Alle',...statuses].map(s=>`<span class="chip${(nacFilter===s||(!nacFilter&&s==='Alle'))?' on':''}" onclick="setNacFilter('${(s||'').replace(/'/g,'')}')">${s||'—'}</span>`).join('')+'</div>';
  h+='<div class="tablewrap"><table><thead><tr><th>Project</th><th>Status</th><th class="num">Verkoop</th><th class="num">Totale kost</th><th class="num">Netto marge</th><th class="num">Netto %</th><th class="num">Juiste prijs</th><th class="num">Verschil</th></tr></thead><tbody>';
  all.filter(r=>!nacFilter||nacFilter==='Alle'||r.status===nacFilter).sort((a,b)=>b.v-a.v).forEach(r=>{const cl=r.d<0?'neg':'pos';
    h+=`<tr><td>${r.proj}</td><td><span class="pill" style="background:${statusColor(r.status)}22;color:${statusColor(r.status)}">${r.status||'—'}</span></td><td class="num">${euro(r.v)}</td><td class="num">${euro(r.k)}</td><td class="num ${r.m<0?'neg':''}">${euro(r.m)}</td><td class="num ${r.p<0.3?'neg':'pos'}">${pct(r.p)}</td><td class="num">${euro(r.j)}</td><td class="num ${cl}">${euro(r.d)}</td></tr>`;});
  h+='</tbody></table></div>';document.getElementById('view-nacalc').innerHTML=h;
  const ch=base.slice().sort((a,b)=>b.v-a.v);
  drawGrouped('cNac',ch.map(r=>r.proj),ch.map(r=>r.v),ch.map(r=>r.j));
}
function setNacFilter(s){nacFilter=s;renderNacalc();}

/* ========== FINANCIEEL ========== */
function renderFinancieel(){
  const rows=FIN.map(r=>({cat:String(r[0]||'').split('\t')[0].trim(),post:r[1],waarde:num(r[2]),nadruk:String(r[3]).trim()==='1',toel:r[4]}));
  const kpi=rows.filter(r=>(r.cat||'').toLowerCase()==='kpi');
  const titles={'resultatenrekening':'Resultatenrekening H1 (jan–jun)','resultaat':'Jaarprognose 2026','btw':'BTW-situatie','cashflow':'Cashflow (04/08)','cash-vooruitzicht':'Cash-vooruitzicht tot jaareinde'};
  const order=['resultatenrekening','resultaat','btw','cashflow','cash-vooruitzicht'];
  let cats=[...new Set(rows.map(r=>(r.cat||'').toLowerCase()).filter(c=>c&&c!=='kpi'))];
  cats.sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);});
  let h='<h2 class="section">Financiële analyse 2026</h2><div class="kpis">';
  kpi.forEach(k=>{const acc=k.waarde<0?'var(--red)':'var(--magenta)';
    h+=`<div class="kpi" style="--accent:${acc}"><div class="lab">${k.post}</div><div class="val ${k.waarde<0?'neg':''}">${euro(k.waarde)}</div><div class="sub">${k.toel||''}</div></div>`;});
  const pR=PIPE.map(r=>({proj:r[0],status:r[4],verkoop:num(r[5]),marge:marge(r[6])}));
  const conf=pR.filter(r=>{const s=(r.status||'').toLowerCase();return (s.includes('bevestigd')||s.includes('productie'))&&!isNaN(r.verkoop);}).sort((a,b)=>b.verkoop-a.verkoop);
  const confTot=conf.reduce((t,r)=>t+r.verkoop,0),confM=conf.reduce((t,r)=>t+r.verkoop*(r.marge||0.30),0);
  h+='</div>';
  h+='<div class="card" style="margin-bottom:20px"><h3>Bevestigde pipeline H2 — voedt de prognose</h3>'
    +'<div style="font-family:Oswald;font-size:24px;font-weight:700;margin-bottom:6px">'+euro(confTot)+' <span style="color:var(--muted);font-size:14px;font-weight:400">verkoop · ≈ '+euro(confM)+' marge @30% · '+conf.length+' bevestigde projecten</span></div>'
    +'<div class="chartwrap" style="height:230px"><canvas id="cFinPipe"></canvas></div>'
    +'<div class="goalnote">Enkel bevestigd + in productie (offertes-uit niet meegerekend). Dit is het fundament onder de H2-prognose.</div></div>';
  h+='<div class="grid2">'
    +'<div class="card"><h3>Waar gaat elke euro omzet naartoe?</h3><div class="chartwrap"><canvas id="cFinKost"></canvas></div></div>'
    +'<div class="card"><h3>Cash-brug tot jaareinde</h3><div class="chartwrap"><canvas id="cFinCash"></canvas></div></div>'
    +'<div class="card"><h3>Resultaat-opbouw H1</h3><div class="chartwrap"><canvas id="cFinRes"></canvas></div></div>'
    +'<div class="card"><h3>Jaarprognose 2026 — resultaat</h3><div class="chartwrap"><canvas id="cFinProg"></canvas></div></div>'
    +'</div>';
  h+='<div class="grid2">';
  cats.forEach(c=>{const rs=rows.filter(r=>(r.cat||'').toLowerCase()===c);if(!rs.length)return;
    h+=`<div class="card"><h3>${titles[c]||rs[0].cat}</h3><div class="tablewrap" style="box-shadow:none;border:none"><table style="min-width:0"><tbody>`;
    rs.forEach(r=>{h+=`<tr class="${r.nadruk?'total':''}"><td>${r.post}${r.toel?` <span style="color:var(--muted);font-weight:400">· ${r.toel}</span>`:''}</td><td class="num ${r.waarde<0?'neg':''}">${euro(r.waarde)}</td></tr>`;});
    h+='</tbody></table></div></div>';});
  h+='</div><div class="note">Bron: gecorrigeerde analyse jan–jul 2026 (Exact + Robaws). Operationeel draait rond break-even; het nettoresultaat wordt gedragen door de eenmalige Backstage-kwijtschelding. Offertes-uit tellen nooit mee in een prognose.</div>';
  document.getElementById('view-financieel').innerHTML=h;
  drawBar('cFinPipe',conf.map(r=>r.proj),conf.map(r=>r.verkoop),conf.map(()=>'var(--magenta)'));
  const val=(ck,pk)=>{const r=rows.find(x=>x.cat.toLowerCase()===ck&&String(x.post||'').toLowerCase().includes(pk));return r?r.waarde:0;};
  const R='resultatenrekening',CV='cash-vooruitzicht',RS='resultaat';
  const omzet=val(R,'omzet h1')+val(R,'overige bedrijfsopbrengsten');
  drawDoughnut('cFinKost',['Aankopen/crew','Personeel','Diensten','Afschrijvingen','Resultaat'],
    [Math.abs(val(R,'aankopen')),Math.abs(val(R,'eigen personeel')),Math.abs(val(R,'diensten')),Math.abs(val(R,'afschrijvingen')),Math.max(val(R,'operationeel resultaat h1'),0)],
    ['var(--magenta)','var(--blue)','var(--amber)','var(--grey)','var(--green)']);
  drawWaterfall('cFinCash',[
    {label:'Cash nu',value:val(CV,'netto cash nu'),type:'total'},
    {label:'− Uitbetalingen',value:val(CV,'uitbetalingen'),type:'delta'},
    {label:'+ Pipeline-marge',value:val(CV,'marge bevestigde'),type:'delta'},
    {label:'Jaareinde',value:val(CV,'verwacht jaareinde'),type:'total'}]);
  drawWaterfall('cFinRes',[
    {label:'Omzet',value:omzet,type:'total'},
    {label:'− Aankopen',value:val(R,'aankopen'),type:'delta'},
    {label:'− Diensten',value:val(R,'diensten'),type:'delta'},
    {label:'− Personeel',value:val(R,'eigen personeel'),type:'delta'},
    {label:'− Afschr.+fin',value:val(R,'afschrijvingen')+val(R,'financieel resultaat'),type:'delta'},
    {label:'= Operationeel',value:val(R,'operationeel resultaat h1'),type:'total'},
    {label:'+ Backstage',value:val(R,'backstage'),type:'delta'},
    {label:'= Netto',value:val(R,'h1-resultaat totaal'),type:'total'}]);
  drawWaterfall('cFinProg',[
    {label:'Op. YTD',value:val(RS,'operationeel ytd'),type:'total'},
    {label:'+ Marge forward',value:val(RS,'marge forward'),type:'delta'},
    {label:'− Overhead H2',value:val(RS,'overhead'),type:'delta'},
    {label:'= Op. 2026',value:val(RS,'operationeel resultaat 2026'),type:'total'},
    {label:'+ Backstage',value:val(RS,'backstage'),type:'delta'},
    {label:'= Netto 2026',value:val(RS,'netto resultaat 2026'),type:'total'}]);
}

/* ========== CHARTS ========== */
const cssv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const resolve=c=>c.startsWith('var(')?cssv(c.slice(4,-1)):c;
Chart.defaults.color='#8b90a0';Chart.defaults.font.family="'Inter',system-ui,Arial";Chart.defaults.borderColor='#282c36';
function destroy(id){if(charts[id]){charts[id].destroy();delete charts[id];}}
function drawBar(id,l,d,c){destroy(id);const e=document.getElementById(id);if(!e)return;charts[id]=new Chart(e,{type:'bar',data:{labels:l,datasets:[{data:d,backgroundColor:c.map(resolve),borderRadius:5}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:x=>euro(x.raw)}}},scales:{y:{ticks:{callback:v=>'€'+(v/1000)+'k'}},x:{ticks:{maxRotation:50,minRotation:25,font:{size:10}}}}}});}
function drawDoughnut(id,l,d,c){destroy(id);const e=document.getElementById(id);if(!e)return;charts[id]=new Chart(e,{type:'doughnut',data:{labels:l,datasets:[{data:d,backgroundColor:c.map(resolve),borderWidth:0}]},options:{maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'right',labels:{boxWidth:12,padding:12}},tooltip:{callbacks:{label:x=>x.label+': '+euro(x.raw)}}}}});}
function drawGrouped(id,l,a,b){destroy(id);const e=document.getElementById(id);if(!e)return;charts[id]=new Chart(e,{type:'bar',data:{labels:l,datasets:[{label:'Werkelijke verkoop',data:a,backgroundColor:resolve('var(--magenta)'),borderRadius:5},{label:'Juiste prijs (30%)',data:b,backgroundColor:resolve('var(--blue)'),borderRadius:5}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'top'},tooltip:{callbacks:{label:x=>x.dataset.label+': '+euro(x.raw)}}},scales:{y:{ticks:{callback:v=>'€'+(v/1000)+'k'}},x:{ticks:{maxRotation:50,minRotation:25,font:{size:10}}}}}});}

function drawWaterfall(id,items){destroy(id);const e=document.getElementById(id);if(!e)return;
  let cum=0;const data=[],colors=[],deltas=[];
  items.forEach(it=>{
    if(it.type==='total'||it.type==='start'){data.push([Math.min(0,it.value),Math.max(0,it.value)]);colors.push(resolve('var(--blue)'));deltas.push(it.value);cum=it.value;}
    else{const s=cum,en=cum+it.value;data.push([Math.min(s,en),Math.max(s,en)]);colors.push(resolve(it.value>=0?'var(--green)':'var(--red)'));deltas.push(it.value);cum=en;}});
  charts[id]=new Chart(e,{type:'bar',data:{labels:items.map(i=>i.label),datasets:[{data,backgroundColor:colors,borderRadius:4}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>euro(deltas[c.dataIndex])}}},
      scales:{y:{ticks:{callback:v=>'€'+(v/1000)+'k'}},x:{ticks:{maxRotation:45,minRotation:30,font:{size:10}}}}}});}
function renderDoelen(){
  const rows=DOEL.map(r=>({doel:r[0],start:num(r[1]),huidig:num(r[2]),streef:num(r[3]),eenheid:String(r[4]||'').trim(),toel:r[5]}));
  const fmt=(v,u)=>u==='%'?(isNaN(v)?'—':Math.round(v)+'%'):euro(v);
  let h='<h2 class="section">Doelen 2026 — afgeleid uit de cijfers</h2><div class="grid2">';
  rows.forEach(g=>{
    let p=(g.streef-g.start)===0?0:(g.huidig-g.start)/(g.streef-g.start);p=Math.max(0,Math.min(1,p));
    const pc=Math.round(p*100),col=p<0.4?'var(--red)':(p<0.75?'var(--amber)':'var(--green)');
    h+=`<div class="card"><div class="goalhead"><span class="goaltitle">${g.doel}</span><span class="goalpct" style="color:${resolve(col)}">${pc}%</span></div>`
      +`<div class="goalbar"><div class="goalfill" style="width:${pc}%;background:${resolve(col)}"></div></div>`
      +`<div class="goalvals">Nu <b>${fmt(g.huidig,g.eenheid)}</b> → doel <b>${fmt(g.streef,g.eenheid)}</b></div>`
      +(g.toel?`<div class="goalnote">${g.toel}</div>`:'')+'</div>';});
  h+='</div><div class="note">Streefwaarden zijn afgeleid uit de analyse en vrij aanpasbaar in de Sheet “CF Actuals - Doelen”. Rode draad: structureel 30% marge lost eigen vermogen, cashbuffer én managementvergoeding samen op.</div>';
  document.getElementById('view-doelen').innerHTML=h;
}
function switchView(v){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));
  ['pipeline','nacalc','financieel','doelen'].forEach(x=>document.getElementById('view-'+x).classList.toggle('hidden',x!==v));}
loadAll();
</script>
